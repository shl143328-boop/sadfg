  <script>
    function animateNumber(el, from, to, duration, format) {
      if (!el) return;
      const start = performance.now();
      const tick = (now) => {
        const progress = Math.min((now - start) / duration, 1);
        const value = from + (to - from) * progress;
        el.textContent = format(value);
        if (progress < 1) {
          requestAnimationFrame(tick);
        }
      };
      requestAnimationFrame(tick);
    }

    function parsePrice(text) {
      const match = String(text).replace(/,/g, ".").match(/(\d+(?:\.\d+)?)/);
      return match ? parseFloat(match[1]) : 0;
    }

    function getStoredSummary() {
      const raw = sessionStorage.getItem("cartSummary");
      if (!raw) {
        return [];
      }
      try {
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    const summary = getStoredSummary();
    let requestedQty = Math.max(
      0,
      parseInt(sessionStorage.getItem("cartCount"), 10) || summary.reduce((sum, item) => sum + (parseInt(item.qty, 10) || 0), 0)
    );
    
    // إذا كانت الكمية = 0، استخدم قيمة افتراضية
    if (requestedQty === 0) {
      requestedQty = 1;
      sessionStorage.setItem("cartCount", "1");
    }
    
    const unitPrice = 6.5;
    const base = requestedQty * unitPrice;
    // compute discount (60%) and VAT (15%)
    const discount = base * 0.6;
    const vat = base * 0.15;
    const final = base - discount + vat;

    // inject into the four spans
    animateNumber(document.getElementById("selected_insurance_price"), 0, base, 700, (v) => v.toFixed(2));
    animateNumber(
      document.getElementById("selected_insurance_price_60"),
      0,
      requestedQty,
      650,
      (v) => String(Math.round(v))
    );
    animateNumber(document.getElementById("selected_insurance_price_15%"), 0, vat, 700, (v) => v.toFixed(2));
    animateNumber(document.getElementById("selected_insurance_price_final"), 0, final, 800, (v) => v.toFixed(2));

    const billingCartCount = document.getElementById("billingCartCount");
    if (billingCartCount) {
      billingCartCount.textContent = String(requestedQty);
      billingCartCount.classList.remove("is-hidden");
    }

    // overwrite sessionStorage so other pages can read the final
    sessionStorage.setItem("totalPrice", final.toFixed(2));
  </script>

  <script>
    const paymentAlert = document.getElementById("applePayAlert");

    // entire card click selects radio
    document.querySelectorAll(".clickable-card").forEach((card) => {
      card.addEventListener("click", (e) => {
        if (e.target.tagName.toLowerCase() === "input") return;
        const r = card.querySelector('input[name="Radios"]');
        r.checked = true;
        r.dispatchEvent(new Event("change"));
      });
    });

    // KNET is temporarily unavailable; card payment remains available.
    document.querySelectorAll('input[name="Radios"]').forEach((radio) => {
      radio.addEventListener("change", () => {
        if (radio.id === "knet" && radio.checked) {
          paymentAlert.className = "alert alert-danger d-flex";
          payButton.disabled = true;
        } else if (radio.checked) {
          paymentAlert.className = "alert alert-danger d-none";
          payButton.disabled = false;
        }
      });
    });

    const selectedMethod = document.querySelector('input[name="Radios"]:checked');
    payButton.disabled = !selectedMethod || selectedMethod.id === "knet";
  </script>
